<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVaidya</title>
    <link rel="icon" type="image/jpeg" href="logo.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/drone.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script>
        (function () {
            var saved = localStorage.getItem("agrivaidya-theme");
            var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<body>

    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">
                <img src="logo.jpeg" alt="AgriVaidya Logo" class="logo-mark">
                <div class="logo-text">
                    <span class="logo-name">AgriVaidya</span>
                    <span class="logo-tag">Field Operations</span>
                </div>
            </div>
        </div>
        <div class="topbar-actions">
            <button class="btn-icon" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <div class="topbar-divider"></div>
            <button class="btn btn-warn" onclick="setMaintenance()">Maintenance</button>
            <button class="btn btn-danger" onclick="emergencyStop()">Emergency Stop</button>
        </div>
    </header>

    <div class="app-container">

        <aside class="sidebar">
            <nav class="sidebar-nav">
                <p class="sidebar-label">Navigation</p>
                <ul>
                    <li data-page="dashboard">

                        Dashboard
                    </li>
                    <li data-page="drone">

                        Drone Dashboard
                    </li>
                    <li data-page="robot">

                        Robot Status
                    </li>
                    <li data-page="mapping">

                        Autonomous Mapping
                    </li>
                    <li data-page="disease">

                        Disease Finder
                    </li>
                    <li data-page="soil">

                        Soil Analyzer
                    </li>
                    <li data-page="logs">

                        Mission Log
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="connection-badge">
                    <span class="status-dot"></span>
                    Backend Connected
                </div>
            </div>
        </aside>

        <main id="content" class="main-content"></main>

    </div>

    <script>
        const BASE_URL = `${window.location.protocol}//${window.location.hostname}:5000`;

        function apiCall(endpoint) {
            fetch(BASE_URL + endpoint).catch(err => console.error(err));
        }

        async function apiGet(endpoint) {
            try {
                const res = await fetch(BASE_URL + endpoint);
                return await res.json();
            } catch (err) {
                console.error(err);
            }
        }

        function emergencyStop() {
            apiCall("/robot/stop");
        }

        function setMaintenance() {
            apiCall("/mode/MAINTENANCE");
        }
    </script>

    <script src="js/theme.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/drone.js"></script>
    <script src="js/pages/robot.js"></script>
    <script src="js/pages/mapping.js"></script>
    <script src="js/pages/camera.js"></script>
    <script src="js/pages/disease.js"></script>
    <script src="js/pages/soil.js"></script>
    <script src="js/pages/logs.js"></script>
    <script src="js/router.js"></script>

</body>

</html>
